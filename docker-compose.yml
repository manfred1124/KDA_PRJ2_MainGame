version: "3.10"
services:
  back:
    build:
      context: ./back
    container_name: fastapi-back
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - ENV=prod
      # DB_URL, 시크릿 등 추가

  front:
    build:
      context: ./front
    container_name: vite-front
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:stable-alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - back
      - front
