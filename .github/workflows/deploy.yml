name: Deploy to AWS EC2
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to AWS ECR
        uses: aws-actions/amazon-ecr-login@v1
        with:
          registry: 907977361190.dkr.ecr.us-east-2.amazonaws.com
      - name: Build and push backend
        run: |
          docker build -t fastapi-app ./backend
          docker tag fastapi-app:latest 907977361190.dkr.ecr.us-east-2.amazonaws.com/fastapi-app:latest
          docker push 907977361190.dkr.ecr.us-east-2.amazonaws.com/fastapi-app:latest
      - name: Build and push frontend
        run: |
          docker build -t react-app ./frontend
          docker tag react-app:latest 907977361190.dkr.ecr.us-east-2.amazonaws.com/react-app:latest
          docker push 907977361190.dkr.ecr.us-east-2.amazonaws.com/react-app:latest
      - name: Build and push nginx
        run: |
          docker build -t nginx ./nginx
          docker tag nginx:latest 907977361190.dkr.ecr.us-east-2.amazonaws.com/nginx:latest
          docker push 907977361190.dkr.ecr.us-east-2.amazonaws.com/nginx:latest
      - name: Deploy to EC2
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: <EC2_PUBLIC_IP>
        run: |
          echo "$EC2_SSH_KEY" > key.pem
          chmod 400 key.pem
          scp -i key.pem docker-compose.yml ec2-user@$EC2_HOST:/home/ec2-user/
          ssh -i key.pem ec2-user@$EC2_HOST << 'EOF'
            aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 907977361190.dkr.ecr.us-east-2.amazonaws.com
            docker-compose down
            docker-compose up -d
          EOF
